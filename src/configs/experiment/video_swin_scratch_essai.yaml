# @package _global_
# Closed-world / from-scratch Video Swin Tiny.
# No external pretrained weights.

model:
  name: video_swin
  num_classes: ${num_classes}
  pretrained: false
  arch: swin3d_t
  weights: NONE
  dropout: 0.55
  head_hidden_mult: 1.5
  freeze_backbone: false
  unfreeze_last_n_blocks: 0
  reset_head: true

dataset:
  num_frames: 32
  val_ratio: 0.2
  seed: 42
  train_labels_csv: csv/train_video_labels.csv
  val_labels_csv: csv/val_video_labels.csv
  tta_temporal_views: 7

training:
  device: cuda
  data_parallel: false
  compile: false
  amp: true
  tf32: true
  cudnn_benchmark: true

  batch_size: 1
  eval_batch_size: 2
  grad_accum_steps: 16

  epochs: 140
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  drop_last: true

  optimizer: adamw
  lr: 0.00010
  differential_lr: false
  backbone_lr_mult: 1.0
  head_lr_mult: 1.0
  weight_decay: 0.08
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-08

  scheduler: cosine_warmup
  warmup_epochs: 12
  min_lr: 1.0e-06
  max_grad_norm: 1.0

  checkpoint_path: ${hydra:runtime.cwd}/checkpoints/video_swin_scratch_t_best.pt
  save_training_state: false
  label_smoothing: 0.12
  class_weighted_loss: true
  balanced_sampler: true

  ema: true
  ema_decay: 0.9995
  validate_ema: true
  early_stopping_patience: 30

  use_augmentation: true
  aug_temporal_jitter: 0.45
  aug_frame_drop: 0.12
  aug_erasing: 0.35
  aug_mixup: 0.20
  aug_mixup_alpha: 0.30
